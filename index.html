<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FlyingChess – Pakistan No 1 Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", Arial, sans-serif;
      background: radial-gradient(circle at top, #eef6ff, #ffffff);
      color: #111;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px 50px;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #ff9800, #ff5722);
      color: #fff;
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 14px;
      margin-bottom: 15px;
      box-shadow: 0 6px 18px rgba(255,87,34,0.35);
    }

    h1 {
      font-size: 46px;
      margin: 15px 0 30px;
      font-weight: 700;
    }

    h1 span {
      color: #0a71c1;
    }

    .btn {
      display: block;
      max-width: 320px;
      margin: 14px auto;
      padding: 18px 0;
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #0a71c1, #1aa3ff);
      box-shadow: 0 12px 30px rgba(26,163,255,0.45);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn.secondary {
      background: linear-gradient(135deg, #10a850, #1fd97a);
      box-shadow: 0 12px 30px rgba(31,217,122,0.45);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.25);
    }

    .image-card {
      background: #fff;
      padding: 18px;
      border-radius: 20px;
      margin: 40px 0 30px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.12);
    }

    /* ❌ NO IMAGE HOVER */
    .image-card img {
      max-width: 100%;
      height: auto;
      border-radius: 14px;
      display: block;
    }

    .urdu-text {
      font-size: 18px;
      line-height: 1.9;
      color: #222;
    }

    .urdu-text span {
      color: #0a71c1;
      font-weight: 600;
    }

    .trust {
      margin-top: 25px;
      font-size: 15px;
      color: #555;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
      }
